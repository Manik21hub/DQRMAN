<script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="/vendor/leaflet.min.js"></script>
  <script src="/vendor/socket.io.min.js"></script>
  <script src="/mesh.js"></script>
  <script src="/map.js"></script>
  <script src="/socket.js"></script>
  <script>
    window.DQRMAN = window.DQRMAN || {};

    document.addEventListener('DOMContentLoaded', () => {
      const mesh = new MeshVisualizer('#mesh-container');
      
      // TODO: Read fallback coordinates dynamically from config.yaml osm.fallback_lat & osm.fallback_lon
      // currently hardcoded to New Delhi.
      const mapConfig = {
        centerCoords: [28.6139, 77.2090]
      };
      const map = new MeshMap('map-container', mapConfig);
      
      const socket = new MeshSocket(
        window.location.origin,
        {
          onMessage: onMsg,
          onConnect: onConnect,
          onDisconnect: onDisconnect,
          onAttackDetected: (data) => {
            const nodeId = data.target_node_id;
            const attackType = data.attack_type === 'replay' ? 'replay' : 'spoof';
            if (nodeId) {
              mesh.showAttack(nodeId, attackType);
              if (window._meshMap) window._meshMap.showAttack(nodeId, attackType);
            }
          }
        }
      );

      let currentNodes = [];
      let currentEdges = [];
      let currentStats = null;
      let mapViewedOnce = false;

      function updateStats() {
        const computedActive = (currentNodes || []).filter(n => n.status === 'ACTIVE').length;
        const computedDestroyed = (currentNodes || []).filter(n => n.status === 'DESTROYED').length;

        const activeCount = Number.isFinite(currentStats?.active_nodes) ? currentStats.active_nodes : computedActive;
        const destroyedCount = Number.isFinite(currentStats?.destroyed_nodes) ? currentStats.destroyed_nodes : computedDestroyed;
        const totalNodes = Number.isFinite(currentStats?.total_nodes)
          ? currentStats.total_nodes
          : Math.max(activeCount + destroyedCount, 1);
        const destroyedPercent = Number.isFinite(currentStats?.destroyed_percent)
          ? currentStats.destroyed_percent
          : (destroyedCount / totalNodes) * 100;
        const meshStatus = String(currentStats?.mesh_status || 'OPERATIONAL').toUpperCase();

        document.getElementById('active-count').textContent = `${activeCount}`;
        document.getElementById('destroyed-count').textContent = `${destroyedCount} (${Math.round(destroyedPercent)}%)`;

        const opDot = document.getElementById('operational-dot');
        const opSpan = document.getElementById('operational-status');
        if (meshStatus === 'OPERATIONAL') {
          opSpan.textContent = 'STATUS: OPERATIONAL';
          opSpan.style.color = '#22c55e';
          opDot.style.background = '#22c55e';
          opSpan.style.fontWeight = 'normal';
        } else if (meshStatus === 'DEGRADED') {
          opSpan.textContent = 'STATUS: DEGRADED';
          opSpan.style.color = '#f59e0b';
          opDot.style.background = '#f59e0b';
          opSpan.style.fontWeight = '600';
        } else {
          opSpan.textContent = 'STATUS: PARTITIONED';
          opSpan.style.color = '#ef4444';
          opDot.style.background = '#ef4444';
          opSpan.style.fontWeight = '700';
        }
      }

      function populateNodeSelect() {
        const select = document.getElementById('node-select');
        const activeNodes = (currentNodes || []).filter(n => n.status === 'ACTIVE');

        // Preserve current selection if it's still valid
        const currentSelection = select.value;

        // Clear and rebuild options
        select.innerHTML = '<option value="">Select node</option>';
        activeNodes.forEach(node => {
          const nodeId = node.node_id || node.id;
          if (!nodeId) return;
          const option = document.createElement('option');
          option.value = nodeId;
          option.textContent = `${String(nodeId).substring(0, 16)}... (${node.status})`;
          select.appendChild(option);
        });

        // Restore selection if still valid
        if (currentSelection && activeNodes.find(n => (n.node_id || n.id) === currentSelection)) {
          select.value = currentSelection;
        }
      }

      function requestLiveLocation() {
        if (!navigator.geolocation) {
          console.warn('Geolocation not available; using fallback coordinates');
          return;
        }

        navigator.geolocation.getCurrentPosition(
          (position) => {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            map.centerOnLocation(lat, lon, 15);

            // Send location to server
            fetch('/api/v1/location', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ lat, lon, accuracy: 500 })
            }).catch(err => console.error('Location POST failed:', err));
          },
          (error) => {
            console.warn('Geolocation failed:', error.message, '; using fallback coordinates');
            // Use fallback coordinates from config (28.6139, 77.2090)
            const fallbackLat = 28.6139;
            const fallbackLon = 77.2090;
            map.centerOnLocation(fallbackLat, fallbackLon, 15);
          }
        );
      }

      async function makeRequest(method, url, body = null, targetButton = null) {
        const originalText = targetButton ? targetButton.textContent : '';
        const originalDisabled = targetButton ? targetButton.disabled : false;

        if (targetButton) {
          targetButton.disabled = true;
          targetButton.textContent = '...';
        }

        try {
          const options = {
            method,
            headers: { 'Content-Type': 'application/json' }
          };
          if (body) options.body = JSON.stringify(body);

          const response = await fetch(url, options);
          if (!response.ok) {
            console.error(`Request failed: ${response.status}`);
          }
        } catch (err) {
          console.error('Request error:', err);
        } finally {
          if (targetButton) {
            targetButton.disabled = originalDisabled;
            targetButton.textContent = originalText;
          }
        }
      }

      function onMsg(data) {
        if (typeof data._latency_ms === 'number') {
          const latency = Math.max(0, Math.round(data._latency_ms));
          const statusLabel = document.getElementById('connection-status');
          if (latency <= 500) {
            statusLabel.textContent = `PUSH_LATENCY: ${latency}ms`;
            statusLabel.style.color = '#22c55e';
          } else {
            statusLabel.textContent = `PUSH_LATENCY: ${latency}ms (HIGH)`;
            statusLabel.style.color = '#ef4444';
          }
        }

        if (data.nodes && data.edges) {
          if (Array.isArray(data.nodes) && Array.isArray(data.edges)) {
            currentNodes = data.nodes;
            currentEdges = data.edges;
            currentStats = (data.stats && typeof data.stats === 'object') ? data.stats : null;
          }

          // Update D3 visualization
          mesh.setData(data.nodes, data.edges);
          mesh.update();

          // Update Leaflet map
          map.setData(data.nodes, data.edges);

          // Update stats and dropdown
          updateStats();
          populateNodeSelect();
        }

        if (data.events && Array.isArray(data.events)) {
          data.events.forEach(event => {
            const feedDiv = document.getElementById('event-feed');
            const eventLine = document.createElement('div');
            eventLine.style.padding = '8px 6px';
            eventLine.style.borderBottom = '1px solid #1E293B';
            eventLine.style.fontSize = '13px';
            eventLine.style.display = 'flex';
            eventLine.style.alignItems = 'center';
            eventLine.style.gap = '8px';

            let cleanTime = '';
            if (event.timestamp) {
              const timestampMs = typeof event.timestamp === 'string' 
                ? new Date(event.timestamp).getTime() 
                : event.timestamp * 1000;
              cleanTime = new Date(timestampMs).toLocaleTimeString('en-US', {
                hour12: false,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
              });
            } else {
              cleanTime = new Date().toLocaleTimeString('en-US', {
                hour12: false,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
              });
            }

            let badgeColor = '#64748B'; // default grey for NODE_FAILED and others
            const et = String(event.event_type || 'UNKNOWN');
            if (et.includes('AUTH')) {
              badgeColor = 'var(--color-trusted, #22C55E)';
            } else if (et.includes('REPLAY') || et.includes('SPOOF')) {
              badgeColor = 'var(--color-compromised, #EF4444)';
            }

            let shortId = 'SYSTEM';
            const possibleId = event.target_node_id || event.node_id || event.destroyed_node_id || 
                               (event.payload && (event.payload.target_node_id || event.payload.node_id || event.payload.source_node_id));
            if (possibleId && typeof possibleId === 'string') {
              shortId = possibleId.substring(0, 8);
            }

            eventLine.innerHTML = `
              <span style="color: #64748B; font-family: 'JetBrains Mono', monospace;">${cleanTime}</span>
              <span style="background: ${badgeColor}; color: #0A0F1C; padding: 2px 6px; border-radius: 4px; font-weight: 600; font-family: 'Orbitron', sans-serif; font-size: 10px;">${et}</span>
              <span style="color: #E2E8F0; font-family: 'JetBrains Mono', monospace;">${shortId}</span>
            `;
            feedDiv.insertBefore(eventLine, feedDiv.firstChild);

            // Remove old events if feed exceeds 200 children
            while (feedDiv.children.length > 200) {
              feedDiv.removeChild(feedDiv.lastChild);
            }

            // Handle NODE_DESTROYED/NODE_FAILED events: animate self-healing.
            if ((event.event_type === 'NODE_FAILED' || event.event_type === 'NODE_DESTROYED') && (event.destroyed_node_id || (event.payload && event.payload.node_id))) {
              const destroyedNodeId = event.destroyed_node_id || (event.payload && event.payload.node_id);
              const oldEdgeKeys = [];

              const oldEdges = Array.isArray(event.old_edges) ? event.old_edges : [];
              if (oldEdges.length > 0) {
                oldEdges.forEach(edge => {
                  const sourceId = typeof edge.source === 'object' ? (edge.source.node_id || edge.source.id) : edge.source;
                  const targetId = typeof edge.target === 'object' ? (edge.target.node_id || edge.target.id) : edge.target;
                  if (sourceId && targetId) {
                    oldEdgeKeys.push(`${sourceId}--${targetId}`);
                  }
                });
              }

              // Find all edges connected to the destroyed node
              if (oldEdgeKeys.length === 0) {
                Object.keys(map._edges).forEach(key => {
                  const [source, target] = key.split('--');
                  if (source === destroyedNodeId || target === destroyedNodeId) {
                    oldEdgeKeys.push(key);
                  }
                });
              }

              // Build node position lookup
              const nodeLatLonMap = {};
              (currentNodes || []).forEach(node => {
                if (node.lat != null && node.lon != null) {
                  const nodeId = node.node_id || node.id;
                  if (nodeId) {
                    nodeLatLonMap[nodeId] = { lat: node.lat, lon: node.lon };
                  }
                }
              });

              // Extract new edges from event if available
              const newEdges = Array.isArray(event.new_edges) ? event.new_edges : [];

              // Trigger self-healing animation on map
              if (oldEdgeKeys.length > 0 || newEdges.length > 0) {
                map.showSelfHeal(destroyedNodeId, oldEdgeKeys, newEdges, nodeLatLonMap);
              }

              // Optional reroute preview path from backend to make healing visually explicit.
              const reroutePath = (event.payload && Array.isArray(event.payload.reroute_path))
                ? event.payload.reroute_path
                : (Array.isArray(event.reroute_path) ? event.reroute_path : []);
              if (reroutePath.length >= 2) {
                mesh.highlightPath(reroutePath, 1900);
                if (window._meshMap) {
                  window._meshMap.highlightPath(reroutePath, 1900);
                }
              }
            }

            // Highlight active trust path when server reports a routed message.
            if (event.event_type === 'EVENT_ROUTE_PATH') {
              const payload = event.payload || {};
              const path = Array.isArray(payload.path) ? payload.path : [];
              if (path.length >= 2) {
                mesh.highlightPath(path, 1500);
                if (window._meshMap) {
                  window._meshMap.highlightPath(path, 1500);
                }
              }
            }

            // Handle attack events forwarded via the events[] array
            if ((event.event_type === 'EVENT_REPLAY_DETECTED' || event.event_type === 'EVENT_SPOOFING_ATTEMPT') && event.target_node_id) {
              const nodeId = event.target_node_id;
              const attackType = event.event_type === 'EVENT_REPLAY_DETECTED' ? 'replay' : 'spoof';
              mesh.showAttack(nodeId, attackType);
              if (window._meshMap) window._meshMap.showAttack(nodeId, attackType);
            }
          });
        }
      }

      function onConnect() {
        document.getElementById('connection-status').textContent = 'Connection: connected';
        document.getElementById('connection-status').style.color = '#22c55e';
      }

      function onDisconnect() {
        document.getElementById('connection-status').textContent = 'Connection: reconnecting';
        document.getElementById('connection-status').style.color = '#facc15';
      }

      function toggleView(viewParam) {
        const meshContainer = document.getElementById('mesh-container');
        const mapContainer = document.getElementById('map-container');
        const tabDashboard = document.getElementById('tab-dashboard');
        const tabMap = document.getElementById('tab-map');

        // Determine if we should switch to map
        let switchToMap = false;
        if (viewParam === 'map') {
            switchToMap = true;
        } else if (viewParam === 'dashboard') {
            switchToMap = false;
        } else {
            // Toggle behavior
            switchToMap = (meshContainer.style.opacity !== '0');
        }

        if (switchToMap) {
          // Switch to MAP
          meshContainer.style.opacity = '0';
          meshContainer.style.pointerEvents = 'none';
          meshContainer.style.zIndex = '1';
          
          mapContainer.style.opacity = '1';
          mapContainer.style.pointerEvents = 'auto';
          mapContainer.style.zIndex = '10';

          tabDashboard.className = "font-['Orbitron'] tracking-[0.1em] uppercase text-sm text-[#505564] hover:text-[#3FF4F4] transition-colors cursor-pointer";
          tabMap.className = "font-['Orbitron'] tracking-[0.1em] uppercase text-sm text-[#00BDFD] border-b-2 border-[#00BDFD] pb-1 cursor-pointer transition-colors";
          
          setTimeout(() => map.map.invalidateSize(), 50);

          // Request live location the first time we switch to map view
          if (!mapViewedOnce) {
            mapViewedOnce = true;
            requestLiveLocation();
          }
        } else {
          // Switch to DASHBOARD
          meshContainer.style.opacity = '1';
          meshContainer.style.pointerEvents = 'auto';
          meshContainer.style.zIndex = '10';

          mapContainer.style.opacity = '0';
          mapContainer.style.pointerEvents = 'none';
          mapContainer.style.zIndex = '1';

          tabDashboard.className = "font-['Orbitron'] tracking-[0.1em] uppercase text-sm text-[#00BDFD] border-b-2 border-[#00BDFD] pb-1 cursor-pointer transition-colors";
          tabMap.className = "font-['Orbitron'] tracking-[0.1em] uppercase text-sm text-[#505564] hover:text-[#3FF4F4] transition-colors cursor-pointer";
        }
      }

      document.getElementById('btn-view').addEventListener('click', () => toggleView());
      document.getElementById('tab-dashboard').addEventListener('click', () => toggleView('dashboard'));
      document.getElementById('tab-map').addEventListener('click', () => toggleView('map'));

      document.getElementById('btn-destroy').addEventListener('click', async () => {
        const selectedId = document.getElementById('node-select').value;
        if (!selectedId) {
          alert('Please select a node');
          return;
        }
        const button = document.getElementById('btn-destroy');
        await makeRequest('DELETE', `/api/v1/nodes/${selectedId}`, null, button);
      });

      document.getElementById('btn-replay').addEventListener('click', async () => {
        const selectedId = document.getElementById('node-select').value;
        if (!selectedId) {
          alert('Please select a node');
          return;
        }
        const button = document.getElementById('btn-replay');
        await makeRequest('POST', '/api/v1/attack', { attack_type: 'replay', target_node_id: selectedId }, button);
      });

      document.getElementById('btn-spoof').addEventListener('click', async () => {
        const selectedId = document.getElementById('node-select').value;
        if (!selectedId) {
          alert('Please select a node');
          return;
        }
        const button = document.getElementById('btn-spoof');
        await makeRequest('POST', '/api/v1/attack', { attack_type: 'spoof', target_node_id: selectedId }, button);
      });

      // Initialize WebSocket connection
      socket.connect();
    });
  </script>
</body>
</html>
