<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DQRMAN Mesh Dashboard</title>
  <link rel="stylesheet" href="/vendor/leaflet.min.css">
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }

    #header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid #d1d5db;
      background: #ffffff;
    }

    #title {
      font-size: 20px;
      font-weight: 700;
      margin-right: auto;
    }

    #stats {
      display: flex;
      gap: 12px;
      font-size: 14px;
    }

    #main {
      display: flex;
      flex-direction: row;
      min-height: 70vh;
    }

    #mesh-container,
    #map-container {
      width: 70%;
      min-height: 70vh;
      border-right: 1px solid #d1d5db;
      background: #ffffff;
    }

    #map-container {
      display: none;
    }

    #event-feed {
      width: 30%;
      min-height: 70vh;
      background: #ffffff;
      overflow: auto;
      padding: 12px;
      box-sizing: border-box;
    }

    #controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 12px 16px;
      border-top: 1px solid #d1d5db;
      background: #ffffff;
    }

    button,
    select {
      padding: 8px 10px;
      font-size: 14px;
    }

    @keyframes auth-pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.5;
      }
    }

    @keyframes attack-flash {
      0%, 100% {
        stroke: #111827;
      }
      50% {
        stroke: #ef4444;
      }
    }

    .auth-pulse {
      animation: auth-pulse 800ms ease-in-out;
    }

    .attack-flash {
      animation: attack-flash 1500ms ease-in-out;
    }
  </style>
</head>
<body>
  <div id="header">
    <div id="title">DQRMAN Mesh Dashboard</div>
    <button id="btn-view" type="button">Toggle View</button>
    <div id="stats">
      <span id="active-count">Active: 0</span>
      <span id="destroyed-count">Destroyed: 0</span>
      <span id="operational-status">Operational: unknown</span>
      <span id="connection-status">Connection: disconnected</span>
    </div>
  </div>

  <div id="main">
    <div id="mesh-container"></div>
    <div id="map-container"></div>
    <div id="event-feed"></div>
  </div>

  <div id="controls">
    <select id="node-select">
      <option value="">Select node</option>
    </select>
    <button id="btn-destroy" type="button">Destroy Node</button>
    <button id="btn-replay" type="button">Inject Replay</button>
    <button id="btn-spoof" type="button">Inject Spoof</button>
  </div>

  <script src="/vendor/d3.min.js"></script>
  <script src="/vendor/react.production.min.js"></script>
  <script src="/vendor/react-dom.production.min.js"></script>
  <script src="/vendor/leaflet.min.js"></script>
  <script src="/vendor/socket.io.min.js"></script>
  <script src="/mesh.js"></script>
  <script src="/map.js"></script>
  <script src="/socket.js"></script>
  <script>
    window.DQRMAN = window.DQRMAN || {};

    document.addEventListener('DOMContentLoaded', () => {
      const mesh = new MeshVisualizer('#mesh-container');
      const map = new MeshMap('map-container');
      const socket = new MeshSocket(
        window.location.origin,
        {
          onMessage: onMsg,
          onConnect: onConnect,
          onDisconnect: onDisconnect
        }
      );

      let currentNodes = [];
      let currentEdges = [];
      let mapViewedOnce = false;

      function updateStats() {
        const activeCount = (currentNodes || []).filter(n => n.status === 'ACTIVE').length;
        const destroyedCount = (currentNodes || []).filter(n => n.status === 'DESTROYED').length;
        const isOperational = currentNodes.length > 0 && (activeCount / currentNodes.length) >= 0.2;

        document.getElementById('active-count').textContent = `Active: ${activeCount}`;
        document.getElementById('destroyed-count').textContent = `Destroyed: ${destroyedCount}`;

        const opSpan = document.getElementById('operational-status');
        if (isOperational) {
          opSpan.textContent = 'Operational: YES';
          opSpan.style.color = '#22c55e';
          opSpan.style.fontWeight = 'normal';
        } else {
          opSpan.textContent = 'Operational: NO';
          opSpan.style.color = '#ef4444';
          opSpan.style.fontWeight = 'bold';
        }
      }

      function populateNodeSelect() {
        const select = document.getElementById('node-select');
        const activeNodes = (currentNodes || []).filter(n => n.status === 'ACTIVE');

        // Preserve current selection if it's still valid
        const currentSelection = select.value;

        // Clear and rebuild options
        select.innerHTML = '<option value="">Select node</option>';
        activeNodes.forEach(node => {
          const nodeId = node.node_id || node.id;
          if (!nodeId) return;
          const option = document.createElement('option');
          option.value = nodeId;
          option.textContent = `${String(nodeId).substring(0, 16)}... (${node.status})`;
          select.appendChild(option);
        });

        // Restore selection if still valid
        if (currentSelection && activeNodes.find(n => (n.node_id || n.id) === currentSelection)) {
          select.value = currentSelection;
        }
      }

      function requestLiveLocation() {
        if (!navigator.geolocation) {
          console.warn('Geolocation not available; using fallback coordinates');
          return;
        }

        navigator.geolocation.getCurrentPosition(
          (position) => {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            map.centerOnLocation(lat, lon, 15);

            // Send location to server
            fetch('/api/v1/location', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ lat, lon, accuracy: 500 })
            }).catch(err => console.error('Location POST failed:', err));
          },
          (error) => {
            console.warn('Geolocation failed:', error.message, '; using fallback coordinates');
            // Use fallback coordinates from config (28.6139, 77.2090)
            const fallbackLat = 28.6139;
            const fallbackLon = 77.2090;
            map.centerOnLocation(fallbackLat, fallbackLon, 15);
          }
        );
      }

      async function makeRequest(method, url, body = null, targetButton = null) {
        const originalText = targetButton ? targetButton.textContent : '';
        const originalDisabled = targetButton ? targetButton.disabled : false;

        if (targetButton) {
          targetButton.disabled = true;
          targetButton.textContent = '...';
        }

        try {
          const options = {
            method,
            headers: { 'Content-Type': 'application/json' }
          };
          if (body) options.body = JSON.stringify(body);

          const response = await fetch(url, options);
          if (!response.ok) {
            console.error(`Request failed: ${response.status}`);
          }
        } catch (err) {
          console.error('Request error:', err);
        } finally {
          if (targetButton) {
            targetButton.disabled = originalDisabled;
            targetButton.textContent = originalText;
          }
        }
      }

      function onMsg(data) {
        if (data.nodes && data.edges) {
          currentNodes = data.nodes;
          currentEdges = data.edges;

          // Update D3 visualization
          mesh.setData(data.nodes, data.edges);
          mesh.update();

          // Update Leaflet map
          map.setData(data.nodes, data.edges);

          // Update stats and dropdown
          updateStats();
          populateNodeSelect();
        }

        if (data.events && Array.isArray(data.events)) {
          data.events.forEach(event => {
            const feedDiv = document.getElementById('event-feed');
            const eventLine = document.createElement('div');
            eventLine.style.padding = '6px';
            eventLine.style.borderBottom = '1px solid #e5e7eb';
            eventLine.style.fontSize = '12px';

            let cleanTime = '';
            if (event.timestamp) {
              const timestampMs = typeof event.timestamp === 'string' 
                ? new Date(event.timestamp).getTime() 
                : event.timestamp * 1000;
              cleanTime = new Date(timestampMs).toLocaleTimeString('en-US', {
                hour12: false,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
              });
            } else {
              cleanTime = new Date().toLocaleTimeString('en-US', {
                hour12: false,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
              });
            }

            eventLine.textContent = `[${cleanTime}] ${event.event_type}: ${JSON.stringify(event)}`;
            feedDiv.insertBefore(eventLine, feedDiv.firstChild);

            // Remove old events if feed exceeds 200 children
            while (feedDiv.children.length > 200) {
              feedDiv.removeChild(feedDiv.lastChild);
            }

            // Handle NODE_FAILED events: find affected edges and animate self-healing
            if (event.event_type === 'NODE_FAILED' && event.destroyed_node_id) {
              const destroyedNodeId = event.destroyed_node_id;
              const oldEdgeKeys = [];

              // Find all edges connected to the destroyed node
              Object.keys(map._edges).forEach(key => {
                const [source, target] = key.split('--');
                if (source === destroyedNodeId || target === destroyedNodeId) {
                  oldEdgeKeys.push(key);
                }
              });

              // Build node position lookup
              const nodeLatLonMap = {};
              (currentNodes || []).forEach(node => {
                if (node.lat != null && node.lon != null) {
                  const nodeId = node.node_id || node.id;
                  if (nodeId) {
                    nodeLatLonMap[nodeId] = { lat: node.lat, lon: node.lon };
                  }
                }
              });

              // Extract new edges from event if available
              const newEdges = event.new_edges || [];

              // Trigger self-healing animation on map
              if (oldEdgeKeys.length > 0 || newEdges.length > 0) {
                map.showSelfHeal(destroyedNodeId, oldEdgeKeys, newEdges, nodeLatLonMap);
              }
            }

            // Handle attack events: animate on both D3 and Leaflet map
            if (event.event_type === 'REPLAY_DETECTED' && event.node_id) {
              mesh.showAttack(event.node_id, 'replay');
              map.showAttack(event.node_id, 'replay');
            }
            if (event.event_type === 'SPOOFING_ATTEMPT' && event.node_id) {
              mesh.showAttack(event.node_id, 'spoof');
              map.showAttack(event.node_id, 'spoof');
            }
          });
        }
      }

      function onConnect() {
        document.getElementById('connection-status').textContent = 'Connection: connected';
      }

      function onDisconnect() {
        document.getElementById('connection-status').textContent = 'Connection: reconnecting';
      }

      function toggleView() {
        const meshContainer = document.getElementById('mesh-container');
        const mapContainer = document.getElementById('map-container');

        if (meshContainer.style.display === 'none') {
          meshContainer.style.display = 'block';
          mapContainer.style.display = 'none';
        } else {
          meshContainer.style.display = 'none';
          mapContainer.style.display = 'block';
          map.map.invalidateSize();

          // Request live location the first time we switch to map view
          if (!mapViewedOnce) {
            mapViewedOnce = true;
            requestLiveLocation();
          }
        }
      }

      document.getElementById('btn-view').addEventListener('click', toggleView);

      document.getElementById('btn-destroy').addEventListener('click', async () => {
        const selectedId = document.getElementById('node-select').value;
        if (!selectedId) {
          alert('Please select a node');
          return;
        }
        const button = document.getElementById('btn-destroy');
        await makeRequest('DELETE', `/api/v1/nodes/${selectedId}`, null, button);
      });

      document.getElementById('btn-replay').addEventListener('click', async () => {
        const selectedId = document.getElementById('node-select').value;
        if (!selectedId) {
          alert('Please select a node');
          return;
        }
        const button = document.getElementById('btn-replay');
        await makeRequest('POST', '/api/v1/attack', { attack_type: 'replay', target_node_id: selectedId }, button);
      });

      document.getElementById('btn-spoof').addEventListener('click', async () => {
        const selectedId = document.getElementById('node-select').value;
        if (!selectedId) {
          alert('Please select a node');
          return;
        }
        const button = document.getElementById('btn-spoof');
        await makeRequest('POST', '/api/v1/attack', { attack_type: 'spoof', target_node_id: selectedId }, button);
      });

      // Initialize WebSocket connection
      socket.connect();
    });
  </script>
</body>
</html>
